# ==================== PERFIL DE PRODUÇÃO (MySQL) ====================

# ==================== DATASOURCE ====================
# URL com parâmetros de conexão segura
spring.datasource.url=${DATABASE_URL}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP - Pool de conexões
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==================== JPA / HIBERNATE ====================
# Dialeto SQL específico do MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# DDL-auto: VALIDATE em produção (não cria/altera schema)
# Use Flyway ou Liquibase para migrações reais
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==================== JWT ====================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ==================== SERVER ====================
server.port=${PORT:8080}

# ==================== LOGGING ====================
logging.level.root=WARN
logging.level.com.rodrigo.demo=INFO

