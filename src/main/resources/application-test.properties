# ==================== PERFIL DE TESTE (H2 Database) ====================
# Este arquivo é carregado quando spring.profiles.active=test

# ==================== DATASOURCE ====================
# Driver JDBC do H2 (banco de dados em memória)
spring.datasource.driverClassName=org.h2.Driver

# URL de conexão: banco em memória chamado "testdb"
# O banco existe apenas enquanto a aplicação está rodando
# Dados são perdidos ao reiniciar (ideal para testes/desenvolvimento)
spring.datasource.url=jdbc:h2:mem:testdb

# Credenciais padrão do H2
spring.datasource.username=sa
spring.datasource.password=

# ==================== H2 CLIENT ====================
# Console web do H2: interface para visualizar e executar SQL
# Acessível em: http://localhost:8080/h2-console
# JDBC URL para conectar: jdbc:h2:mem:testdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==================== JPA / HIBERNATE ====================
# Dialeto SQL específico do H2
# O Hibernate usa isso para gerar SQL compatível com o banco
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Adia a inicialização do datasource (útil com CommandLineRunner)
spring.jpa.defer-datasource-initialization=true

# Mostra SQL gerado pelo Hibernate no console (útil para debug)
spring.jpa.show-sql=true

# Formata o SQL para melhor legibilidade no console
spring.jpa.properties.hibernate.format_sql=true