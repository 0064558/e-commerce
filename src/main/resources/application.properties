# ==================== CONFIGURAÃ‡Ã•ES GERAIS ====================
# Nome da aplicaÃ§Ã£o Spring Boot
spring.application.name=demo

# Arquivo local opcional para segredos (nao versionado)
spring.config.import=optional:file:./local-secrets.properties

# Perfil ativo: "test" usa o banco H2 em memória
# Para usar PostgreSQL em produção, mudar para "prod" ou "dev"
spring.profiles.active=dev

spring.jpa.open-in-view=true

api.security.token.secret=${JWT_SECRET:dev-jwt-change-me}

abacatepay.base-url=${ABACATEPAY_BASE_URL:https://api.abacatepay.com/v1}
abacatepay.api-key=${ABACATEPAY_API_KEY:}
abacatepay.return-url=${ABACATEPAY_RETURN_URL:http://localhost:3000/checkout}
abacatepay.completion-url=${ABACATEPAY_COMPLETION_URL:http://localhost:3000/success}
abacatepay.webhook-secret=${ABACATEPAY_WEBHOOK_SECRET:}

shipping.quote.external-url=${SHIPPING_QUOTE_EXTERNAL_URL:}
shipping.quote.external-token=${SHIPPING_QUOTE_EXTERNAL_TOKEN:}
shipping.quote.origin-zip-code=${SHIPPING_QUOTE_ORIGIN_ZIP_CODE:39730-000}
shipping.quote.services=${SHIPPING_QUOTE_SERVICES:1,2,17,18}
shipping.geo.base-url=${SHIPPING_GEO_BASE_URL:https://nominatim.openstreetmap.org/search}

melhorenvio.base-url=${MELHOR_ENVIO_BASE_URL:https://sandbox.melhorenvio.com.br}
melhorenvio.client-id=${MELHOR_ENVIO_CLIENT_ID:}
melhorenvio.client-secret=${MELHOR_ENVIO_CLIENT_SECRET:}
melhorenvio.redirect-uri=${MELHOR_ENVIO_REDIRECT_URI:}
melhorenvio.scope=${MELHOR_ENVIO_SCOPE:shipping-calculate}
melhorenvio.user-agent=${MELHOR_ENVIO_USER_AGENT:Nexus Store (suporte@nexusstore.local)}
melhorenvio.access-token=${MELHOR_ENVIO_ACCESS_TOKEN:}
melhorenvio.refresh-token=${MELHOR_ENVIO_REFRESH_TOKEN:}
melhorenvio.access-token-expires-at=${MELHOR_ENVIO_ACCESS_TOKEN_EXPIRES_AT:0}