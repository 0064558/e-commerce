# ==================== CONFIGURAÇÕES GERAIS ====================
# Nome da aplicação Spring Boot
spring.application.name=demo

# Perfil ativo: "test" usa o banco H2 em memória
# Para usar PostgreSQL em produção, mudar para "prod" ou "dev"
spring.profiles.active=prod

# Open Session in View: mantém a sessão JPA aberta durante a renderização da view
# Permite carregar relacionamentos lazy mesmo fora do @Transactional
# ATENÇÃO: pode causar problemas de performance em aplicações complexas
spring.jpa.open-in-view=true

api.security.token.secret=${JWT_SECRET:my-secret-key}